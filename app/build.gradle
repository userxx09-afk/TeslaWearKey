plugins {
    id 'com.android.application'
}
apply plugin: 'kotlin-android'

android {
    compileSdk 35
    buildToolsVersion "35.0.1"
    namespace "li.power.app.wearos.teslanak"

    defaultConfig {
        applicationId "li.power.app.wearos.teslanak"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 26
        versionName "1.4.2"

    }

    // Release signing comes from the environment (GitHub secrets in CI), never
    // from the repo. If the env vars are absent (e.g. a local debug build), the
    // release build is simply left unsigned.
    signingConfigs {
        release {
            def kp = System.getenv("WATCHKEY_KEYSTORE_PATH")
            if (kp != null) {
                storeFile file(kp)
                storePassword System.getenv("WATCHKEY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("WATCHKEY_KEY_ALIAS")
                keyPassword System.getenv("WATCHKEY_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("WATCHKEY_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.wear:wear:1.3.0'
    implementation "org.bouncycastle:bcprov-jdk18on:1.79"
    implementation group: 'commons-codec', name: 'commons-codec', version: '1.15'
    implementation "androidx.core:core-splashscreen:1.2.0-beta02"
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}
